<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotation Studio - Start</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        .bg-forest { background-color: #2D6A4F !important; }
        .btn-leaf { background-color: #52B788; color: white; border: none; }
        .btn-leaf:hover { background-color: #40916c; color: white; }
        .split-bg { background: linear-gradient(to bottom, #ffffff 35%, #D8E2DC 35%); min-height: calc(100vh - 60px); padding: 40px 0; }
        .hero-card { background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .plant-selector-box { overflow-y: auto; border: 1px solid #eaeaea; border-radius: 12px; text-align: left; background: #fdfdfd; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-forest px-4" style="height: 60px;">
    <a class="navbar-brand fw-bold" href="/">Quotation Studio</a>
    <a href="/dashboard" class="text-white text-decoration-none fw-semibold">Database Dashboard →</a>
</nav>

<div class="split-bg d-flex align-items-center justify-content-center">
    <div class="hero-card p-5 text-center mx-3" style="max-width: 650px; width: 100%;">
        <h1 class="fw-bolder mb-2" style="color: #1B4332; font-size: 2.3rem;">Create a New Quotation</h1>
        <p class="text-muted mb-4 small">Select pre-existing inventory items and enter your client name to begin.</p>
        
        <form action="/new_quotation" method="POST">
            <!-- NEW: Category Filter Buttons -->
            <div class="d-flex flex-wrap gap-2 mb-3 justify-content-center">
                <button type="button" class="btn btn-sm btn-leaf cat-btn active" onclick="filterIndex('All', this)">All</button>
                {% for cat in items|map(attribute='category_name')|unique %}
                <button type="button" class="btn btn-sm btn-outline-secondary cat-btn" onclick="filterIndex('{{ cat }}', this)">{{ cat }}</button>
                {% endfor %}
            </div>

            <!-- Plant Selector List -->
            <div class="plant-selector-box p-3 mb-4" style="height: 280px;">
                {% for item in items %}
                <div class="form-check mb-2 plant-item" data-category="{{ item.category_name }}">
                    <input class="form-check-input" type="checkbox" name="selected_items" value="{{ item.id }}" id="item{{ item.id }}">
                    <label class="form-check-label w-100 small" for="item{{ item.id }}">
                        <strong class="text-dark">{{ item.botanical_name }}</strong> 
                        {% if item.height %}<span class="text-success fw-bold ms-1">[H: {{ item.height }}]</span>{% endif %}
                    </label>
                </div>
                {% else %}
                <p class="small text-muted text-center my-3">No plants found in database.</p>
                {% endfor %}
            </div>

            <input type="text" name="client_name" class="form-control form-control-lg mb-4 text-center rounded-pill bg-light border-0 fs-6" placeholder="Enter Project / Client Name" required>
            <button type="submit" class="btn btn-leaf btn-lg rounded-4 px-4 py-3 fw-bold shadow-sm w-100">Launch Document Editor →</button>
        </form>
    </div>
</div>

<script>
function filterIndex(category, btnElement) {
    // Update button colors
    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('btn-leaf', 'active');
        btn.classList.add('btn-outline-secondary');
    });
    btnElement.classList.remove('btn-outline-secondary');
    btnElement.classList.add('btn-leaf', 'active');

    // Hide/Show plants based on category
    document.querySelectorAll('.plant-item').forEach(item => {
        if (category === 'All' || item.getAttribute('data-category') === category) {
            item.style.display = 'block';
        } else {
            item.style.display = 'none';
        }
    });
}
</script>
</body>
</html>
